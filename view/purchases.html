<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras - MotoStock Pro 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-slate-200 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <i class="fas fa-motorcycle text-blue-600 text-2xl"></i>
                <span class="text-xl font-bold tracking-wider">MOTOSTOCK <span class="text-blue-600">PRO</span></span>
            </a>
            <div class="hidden lg:flex space-x-4 text-sm">
                <a href="index.html" class="hover:text-blue-600 transition">Inicio</a>
                <a href="inventory.html" class="hover:text-blue-600 transition">Inventario</a>
                <a href="sales.html" class="hover:text-blue-600 transition">Ventas</a>
                <a href="purchases.html" class="text-blue-600 font-bold">Compras</a>
                <a href="customers.html" class="hover:text-blue-600 transition">Clientes</a>
                <a href="suppliers.html" class="hover:text-blue-600 transition">Proveedores</a>
                <a href="cash.html" class="hover:text-blue-600 transition">Caja</a>
                <a href="reports.html" class="hover:text-blue-600 transition">Reportes</a>
                <a href="settings.html" class="hover:text-blue-600 transition"><i class="fas fa-cog"></i></a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Registro de Compras (Entradas)</h1>
            <div class="flex space-x-4">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-3 text-slate-500"></i>
                    <input type="text" id="search-purchase" oninput="filterPurchases()" placeholder="Buscar compra..." class="bg-white shadow-sm border border-slate-200 rounded-lg py-2 pl-10 pr-4 focus:outline-none focus:border-blue-500 transition">
                </div>
                <button onclick="abrirModalCompra()" class="bg-orange-600 hover:bg-orange-700 px-6 py-2 rounded-lg font-bold transition">
                    Nueva Orden de Compra
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white shadow-sm p-6 rounded-xl border border-slate-200">
                <p class="text-slate-500 text-sm uppercase">Total Compras Mes</p>
                <p id="total-compras-mes" class="text-2xl font-bold text-orange-500">S/ 4,500.00</p>
            </div>
            <div class="bg-white shadow-sm p-6 rounded-xl border border-slate-200">
                <p class="text-slate-500 text-sm uppercase">Órdenes Hoy</p>
                <p id="ordenes-hoy" class="text-2xl font-bold text-yellow-600">1</p>
            </div>
            <div class="bg-white shadow-sm p-6 rounded-xl border border-slate-200">
                <p class="text-slate-500 text-sm uppercase">Proveedores Contactados</p>
                <p id="total-proveedores-compra" class="text-2xl font-bold text-blue-600">3</p>
            </div>
        </div>

        <div class="bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-100/50 text-slate-500 uppercase text-xs">
                    <tr>
                        <th class="p-4">Fecha</th>
                        <th class="p-4">Proveedor</th>
                        <th class="p-4">Items</th>
                        <th class="p-4">Total</th>
                        <th class="p-4">Estado</th>
                        <th class="p-4 text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="purchases-table-body" class="divide-y divide-slate-100">
                    <!-- Las compras se cargarán aquí -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Nueva Compra -->
    <div id="modal-compra" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white shadow-sm border border-slate-200 w-full max-w-2xl rounded-2xl p-6 shadow-2xl">
            <h3 class="text-xl font-bold mb-6">Registrar Nueva Entrada de Mercadería</h3>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Proveedor</label>
                    <select id="comp-prov" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:border-blue-500 outline-none transition">
                        <option value="Honda del Perú">Honda del Perú S.A.</option>
                        <option value="Yamaha Motor Selva">Yamaha Motor Selva</option>
                        <option value="Bajaj Repuestos">Bajaj Repuestos Import</option>
                        <option value="China Parts">China Parts Importaciones</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Número de Factura / Guía</label>
                    <input type="text" id="comp-factura" placeholder="F001-000123" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:border-blue-500 outline-none transition">
                </div>
            </div>
            
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-6">
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <div class="col-span-2 text-xs font-bold text-slate-500">PRODUCTO</div>
                    <div class="text-xs font-bold text-slate-500 text-center">CANT.</div>
                    <div class="text-xs font-bold text-slate-500 text-right">COSTO UN.</div>
                </div>
                <div id="comp-items" class="space-y-2">
                    <div class="grid grid-cols-4 gap-2">
                        <input type="text" placeholder="Nombre del repuesto" class="col-span-2 bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm">
                        <input type="number" value="1" class="bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm text-center">
                        <input type="number" value="0.00" class="bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm text-right">
                    </div>
                </div>
                <button onclick="agregarFilaCompra()" class="mt-4 text-blue-600 text-xs hover:underline">+ Agregar otro producto</button>
            </div>

            <div class="flex space-x-3">
                <button onclick="cerrarModalCompra()" class="flex-1 py-3 bg-slate-100 rounded-xl font-bold hover:bg-slate-600 transition">CANCELAR</button>
                <button onclick="guardarCompra()" class="flex-1 py-3 bg-orange-600 rounded-xl font-bold hover:bg-orange-700 transition">REGISTRAR ENTRADA</button>
            </div>
        </div>
    </div>

    <script>
        let allPurchases = [
            { fecha: '16/05/2026', proveedor: 'Honda del Perú', items: 12, total: 4500.00, estado: 'Recibido', factura: 'F001-456' },
            { fecha: '14/05/2026', proveedor: 'China Parts Import', items: 45, total: 2100.00, estado: 'Recibido', factura: 'F005-992' },
            { fecha: '12/05/2026', proveedor: 'Yamaha Motor Selva', items: 5, total: 1800.00, estado: 'Pendiente', factura: 'F002-115' }
        ];

        function renderPurchases(list) {
            const body = document.getElementById('purchases-table-body');
            body.innerHTML = list.map(p => `
                <tr class="hover:bg-slate-100/30 transition border-b border-slate-200/50">
                    <td class="p-4 text-sm text-slate-500">${p.fecha}</td>
                    <td class="p-4">
                        <div class="font-bold text-slate-900">${p.proveedor}</div>
                        <div class="text-[10px] text-slate-500">${p.factura}</div>
                    </td>
                    <td class="p-4 text-sm text-slate-700">${p.items} items</td>
                    <td class="p-4 font-bold text-orange-400">S/ ${p.total.toFixed(2)}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 ${p.estado === 'Recibido' ? 'bg-green-500/20 text-green-600' : 'bg-yellow-500/20 text-yellow-600'} rounded text-[10px] font-bold uppercase">
                            ${p.estado}
                        </span>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="alert('Viendo detalle de ${p.factura}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition">
                            <i class="fas fa-file-invoice"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterPurchases() {
            const query = document.getElementById('search-purchase').value.toLowerCase();
            const filtered = allPurchases.filter(p => 
                p.proveedor.toLowerCase().includes(query) || 
                p.factura.toLowerCase().includes(query)
            );
            renderPurchases(filtered);
        }

        function abrirModalCompra() {
            document.getElementById('modal-compra').classList.remove('hidden');
            document.getElementById('modal-compra').classList.add('flex');
        }

        function cerrarModalCompra() {
            document.getElementById('modal-compra').classList.add('hidden');
            document.getElementById('modal-compra').classList.remove('flex');
        }

        function agregarFilaCompra() {
            const container = document.getElementById('comp-items');
            const div = document.createElement('div');
            div.className = 'grid grid-cols-4 gap-2';
            div.innerHTML = `
                <input type="text" placeholder="Nombre del repuesto" class="col-span-2 bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm">
                <input type="number" value="1" class="bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm text-center">
                <input type="number" value="0.00" class="bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm text-right">
            `;
            container.appendChild(div);
        }

        function guardarCompra() {
            const prov = document.getElementById('comp-prov').value;
            const fact = document.getElementById('comp-factura').value;
            if (!fact) return alert('El número de factura es obligatorio');

            allPurchases.unshift({
                fecha: new Date().toLocaleDateString(),
                proveedor: prov,
                items: document.getElementById('comp-items').children.length,
                total: 0.00, // Simulado
                estado: 'Recibido',
                factura: fact
            });

            renderPurchases(allPurchases);
            cerrarModalCompra();
            alert('✅ Orden de compra registrada y stock actualizado.');
        }

        document.addEventListener('DOMContentLoaded', () => renderPurchases(allPurchases));
    </script>
</body>
</html>
