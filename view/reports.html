<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - MotoStock Pro 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <i class="fas fa-motorcycle text-blue-500 text-2xl"></i>
                <span class="text-xl font-bold tracking-wider">MOTOSTOCK <span class="text-blue-500">PRO</span></span>
            </a>
            <div class="hidden lg:flex space-x-4 text-sm">
                <a href="index.html" class="hover:text-blue-400 transition">Inicio</a>
                <a href="inventory.html" class="hover:text-blue-400 transition">Inventario</a>
                <a href="sales.html" class="hover:text-blue-400 transition">Ventas</a>
                <a href="purchases.html" class="hover:text-blue-400 transition">Compras</a>
                <a href="customers.html" class="hover:text-blue-400 transition">Clientes</a>
                <a href="suppliers.html" class="hover:text-blue-400 transition">Proveedores</a>
                <a href="cash.html" class="hover:text-blue-400 transition">Caja</a>
                <a href="reports.html" class="text-blue-400 font-bold">Reportes</a>
                <a href="settings.html" class="hover:text-blue-400 transition"><i class="fas fa-cog"></i></a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-8">
        <div class="grid grid-cols-2 gap-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-xl font-bold mb-6">Ventas Semanales</h3>
                <canvas id="salesChart"></canvas>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-xl font-bold mb-6">Categorías Populares</h3>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        const ctxSales = document.getElementById('salesChart').getContext('2d');
        new Chart(ctxSales, {
            type: 'line',
            data: {
                labels: ['Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab', 'Dom'],
                datasets: [{
                    label: 'Ventas (S/)',
                    data: [1200, 1900, 3000, 5000, 2000, 3000, 4500],
                    borderColor: '#3b82f6',
                    tension: 0.4
                }]
            }
        });
    </script>
</body>
</html>
