<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - MotoStock Pro 2026</title>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true' || sessionStorage.getItem('role') !== 'admin') {
            window.location.replace('login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen overflow-hidden flex flex-col">
    <nav class="bg-white shadow-sm border-b border-slate-200 p-4 shrink-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <i class="fas fa-motorcycle text-blue-600 text-2xl"></i>
                <span class="text-xl font-bold tracking-wider">MOTOSTOCK <span class="text-blue-600">PRO</span></span>
            </a>
            <div class="hidden lg:flex space-x-4 text-sm">
                <a href="index.html" class="hover:text-blue-600 transition">Inicio</a>
                <a href="inventory.html" class="hover:text-blue-600 transition">Inventario</a>
                <a href="sales.html" class="text-blue-600 font-bold">Ventas</a>
                <a href="purchases.html" class="hover:text-blue-600 transition">Compras</a>
                <a href="customers.html" class="hover:text-blue-600 transition">Clientes</a>
                <a href="suppliers.html" class="hover:text-blue-600 transition">Proveedores</a>
                <a href="cash.html" class="hover:text-blue-600 transition">Caja</a>
                <a href="reports.html" class="hover:text-blue-600 transition">Reportes</a>
                <a href="settings.html" class="hover:text-blue-600 transition"><i class="fas fa-cog"></i></a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex overflow-hidden">
        <!-- Products Selection -->
        <div class="w-2/3 p-6 overflow-y-auto custom-scrollbar h-full">
            <div class="mb-6 flex space-x-4">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3 top-3 text-slate-500"></i>
                    <input type="text" id="search-product" oninput="filterPOSProducts()" placeholder="Buscar por código o nombre..." class="w-full bg-white shadow-sm border border-slate-200 rounded-xl py-2 pl-10 pr-4 focus:outline-none focus:border-blue-500 transition">
                </div>
                <select id="category-filter" onchange="filterPOSProducts()" class="bg-white shadow-sm border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 transition text-slate-700">
                    <option value="all">Todas las categorías</option>
                    <option value="1">Motor</option>
                    <option value="2">Frenos</option>
                    <option value="3">Transmisión</option>
                    <option value="6">Lubricantes</option>
                    <option value="5">Eléctrico</option>
                    <option value="4">Suspensión</option>
                    <option value="8">Accesorios</option>
                </select>
            </div>
            <div id="pos-products-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-10">
                <!-- Los productos se cargarán dinámicamente aquí -->
            </div>
        </div>

        <!-- Order Summary -->
        <div class="w-1/3 bg-white shadow-sm border-l border-slate-200 flex flex-col shadow-2xl h-full overflow-hidden">
            <div class="p-6 pb-2 shrink-0">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-shopping-cart mr-2 text-blue-600"></i> Carrito de Venta
                </h2>
                
                <!-- Customer Section -->
                <div class="p-4 bg-slate-50/50 rounded-xl border border-slate-200">
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-2 tracking-widest">Identificación del Cliente</label>
                    <div class="flex space-x-2 mb-3">
                        <input type="text" id="dni-input" placeholder="DNI o RUC" class="flex-1 bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none transition">
                        <button onclick="buscarCliente()" class="bg-blue-50 text-blue-600 border border-blue-500/20 px-3 py-2 rounded-lg hover:bg-blue-600 hover:text-slate-900 transition">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <input type="text" id="nombre-cliente" placeholder="Nombre del cliente o 'Público General'" class="w-full bg-white shadow-sm border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <!-- Cart Items - Scrollable area -->
            <div class="flex-1 overflow-y-auto px-6 py-4 custom-scrollbar min-h-0 bg-white shadow-sm/50">
                <div id="cart-items" class="space-y-3 pb-4">
                    <!-- Items del carrito -->
                </div>
                <div id="empty-cart-msg" class="text-center py-10 text-slate-600 italic">
                    <i class="fas fa-box-open text-4xl mb-2"></i>
                    <p>El carrito está vacío</p>
                </div>
            </div>
            
            <!-- Summary y Botones - Siempre visibles abajo -->
            <div class="p-6 bg-slate-50 border-t border-slate-200 shrink-0">
                <div class="space-y-2 mb-4">
                    <div class="flex justify-between text-slate-500 text-xs">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">S/ 0.00</span>
                    </div>
                    <div class="flex justify-between text-slate-500 text-xs">
                        <span>IGV (18%)</span>
                        <span id="cart-igv">S/ 0.00</span>
                    </div>
                    <div class="flex justify-between text-2xl font-black text-slate-900 py-2">
                        <span>TOTAL</span>
                        <span id="cart-total" class="text-blue-600">S/ 0.00</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="verBoleta()" class="bg-slate-100 hover:bg-slate-600 py-4 rounded-xl font-bold transition flex flex-col items-center justify-center group">
                        <i class="fas fa-file-invoice mb-1 group-hover:text-blue-600 transition text-lg"></i>
                        <span class="text-[10px] tracking-widest">VER BOLETA</span>
                    </button>
                    <button onclick="procesarPago()" class="bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold shadow-lg shadow-blue-500/20 transition flex flex-col items-center justify-center transform active:scale-95 group">
                        <i class="fas fa-check-circle mb-1 text-xl group-hover:scale-110 transition"></i>
                        <span class="tracking-widest">PAGAR</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Vista Previa de Boleta -->
    <div id="modal-boleta" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white text-black w-full max-w-md rounded-2xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-700">VISTA PREVIA DE BOLETA</h3>
                <button onclick="cerrarBoleta()" class="text-gray-400 hover:text-red-600 transition text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-8 max-h-[70vh] overflow-y-auto" id="boleta-preview-content">
                <!-- Contenido de la boleta inyectado aquí -->
            </div>
            <div class="p-4 bg-gray-50 border-t border-gray-200 flex space-x-3">
                <button onclick="cerrarBoleta()" class="flex-1 py-3 bg-gray-600 text-slate-900 rounded-xl font-bold hover:bg-gray-700 transition">CERRAR VISTA PREVIA</button>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let cart = [];

        async function loadPOSProducts() {
            try {
                const response = await fetch('/api/productos');
                allProducts = await response.json();
                renderPOSProducts(allProducts);
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function renderPOSProducts(products) {
            const grid = document.getElementById('pos-products-grid');
            grid.innerHTML = products.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white shadow-sm p-3 rounded-xl border border-slate-200 hover:border-blue-500 cursor-pointer transition group transform active:scale-95">
                    <div class="h-24 bg-slate-100/50 rounded-lg mb-2 flex items-center justify-center overflow-hidden">
                        ${p.imagen_url ? 
                            `<img src="${p.imagen_url}" class="w-full h-full object-contain p-2 group-hover:scale-110 transition duration-500">` : 
                            `<i class="fas fa-box text-3xl text-slate-600 group-hover:text-blue-600/50 transition"></i>`
                        }
                    </div>
                    <h3 class="font-bold text-xs h-8 overflow-hidden leading-tight mb-1">${p.nombre}</h3>
                    <div class="flex justify-between items-center">
                        <p class="text-blue-600 font-black text-sm">S/ ${parseFloat(p.precio_venta).toFixed(2)}</p>
                        <p class="text-[10px] ${p.stock <= 5 ? 'text-red-600' : 'text-slate-500'} font-bold">Stock: ${p.stock}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterPOSProducts() {
            const query = document.getElementById('search-product').value.toLowerCase();
            const catId = document.getElementById('category-filter').value;
            const filtered = allProducts.filter(p => {
                const matchesQuery = p.nombre.toLowerCase().includes(query) || p.codigo_fabrica?.toLowerCase().includes(query);
                const matchesCat = catId === 'all' || p.categoria_id == catId;
                return matchesQuery && matchesCat;
            });
            renderPOSProducts(filtered);
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) { existing.quantity++; } else { cart.push({ ...product, quantity: 1 }); }
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            if (cart.length === 0) {
                container.innerHTML = '';
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                container.innerHTML = cart.map((item, index) => `
                    <div class="flex justify-between items-center bg-slate-50/50 p-3 rounded-lg border border-slate-200/50 animate-fade-in">
                        <div class="flex-1 min-w-0 pr-4">
                            <p class="font-bold text-sm truncate text-slate-900">${item.nombre}</p>
                            <p class="text-[10px] text-slate-500">S/ ${parseFloat(item.precio_venta).toFixed(2)} x ${item.quantity}</p>
                        </div>
                        <div class="text-right flex items-center space-x-3">
                            <p class="font-black text-sm text-blue-600">S/ ${(item.precio_venta * item.quantity).toFixed(2)}</p>
                            <button onclick="removeFromCart(${index})" class="text-red-600/50 hover:text-red-600 transition">
                                <i class="fas fa-times-circle"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            const subtotal = cart.reduce((sum, item) => sum + (item.precio_venta * item.quantity), 0);
            const igv = subtotal * 0.18;
            const total = subtotal + igv;
            document.getElementById('cart-subtotal').innerText = `S/ ${subtotal.toFixed(2)}`;
            document.getElementById('cart-igv').innerText = `S/ ${igv.toFixed(2)}`;
            document.getElementById('cart-total').innerText = `S/ ${total.toFixed(2)}`;
        }

        const clientesDB = { "71234567": "Juan Carlos Pérez", "20123456789": "MotoRepuestos S.A.C", "12345678": "Maria Garcia Lopez" };

        function buscarCliente() {
            const dni = document.getElementById('dni-input').value;
            const nombreInput = document.getElementById('nombre-cliente');
            if (clientesDB[dni]) {
                nombreInput.value = clientesDB[dni];
                nombreInput.classList.add('text-blue-600', 'font-bold');
            } else {
                alert('Cliente no encontrado.');
            }
        }

        function verBoleta() {
            const dni = document.getElementById('dni-input').value.trim();
            const nombre = document.getElementById('nombre-cliente').value.trim() || 'PÚBLICO GENERAL';
            
            if (cart.length === 0) return alert('⚠️ El carrito está vacío');
            
            if (!dni) {
                alert('⚠️ ERROR: El DNI o RUC es obligatorio para generar la boleta.');
                document.getElementById('dni-input').focus();
                document.getElementById('dni-input').classList.add('border-red-500', 'animate-pulse');
                setTimeout(() => document.getElementById('dni-input').classList.remove('border-red-500', 'animate-pulse'), 3000);
                return false;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.precio_venta * item.quantity), 0);
            const igv = subtotal * 0.18;
            const total = subtotal + igv;
            const content = `
                <div style="font-family: 'Courier New', monospace; font-size: 13px; color: #000;">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <div style="font-size: 20px; font-weight: 900; margin-bottom: 5px;">MOTOSTOCK PRO 2026</div>
                        <div style="font-size: 11px; line-height: 1.2;">
                            REPUESTOS "EL VELOZ"<br>
                            Av. Centenario 456, Pucallpa<br>
                            RUC: 20123456789 - Tel: 987 654 321
                        </div>
                    </div>
                    <div style="margin-bottom: 15px; font-size: 11px;">
                        <p style="margin: 2px 0;"><strong>FECHA:</strong> ${new Date().toLocaleString()}</p>
                        <p style="margin: 2px 0;"><strong>DNI/RUC:</strong> ${dni}</p>
                        <p style="margin: 2px 0;"><strong>CLIENTE:</strong> ${nombre.toUpperCase()}</p>
                        <p style="margin: 2px 0;"><strong>TIPO:</strong> BOLETA ELECTRÓNICA</p>
                    </div>
                    <table style="width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 11px;">
                        <thead>
                            <tr style="border-bottom: 1px solid #000;">
                                <th style="text-align: left; padding: 5px 0;">DESCRIPCIÓN</th>
                                <th style="text-align: center; padding: 5px 0;">CANT</th>
                                <th style="text-align: right; padding: 5px 0;">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${cart.map(item => `
                                <tr>
                                    <td style="padding: 5px 0;">${item.nombre.toUpperCase()}</td>
                                    <td style="text-align: center; padding: 5px 0;">${item.quantity}</td>
                                    <td style="text-align: right; padding: 5px 0;">S/ ${(item.precio_venta * item.quantity).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div style="border-top: 1px solid #000; padding-top: 10px; margin-top: 10px;">
                        <div style="display:flex; justify-content: space-between; font-size: 11px;">
                            <span>SUBTOTAL:</span> <span>S/ ${subtotal.toFixed(2)}</span>
                        </div>
                        <div style="display:flex; justify-content: space-between; font-size: 11px;">
                            <span>IGV (18%):</span> <span>S/ ${igv.toFixed(2)}</span>
                        </div>
                        <div style="display:flex; justify-content: space-between; font-weight: bold; font-size: 15px; margin-top: 5px;">
                            <span>TOTAL:</span> <span>S/ ${total.toFixed(2)}</span>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 30px; font-size: 10px; border-top: 1px dashed #ccc; padding-top: 15px;">
                        <p>¡GRACIAS POR SU PREFERENCIA!</p>
                        <p>Representación impresa de la boleta de venta electrónica.</p>
                    </div>
                </div>
            `;
            document.getElementById('boleta-preview-content').innerHTML = content;
            const modal = document.getElementById('modal-boleta');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('scale-95');
                document.getElementById('modal-content').classList.add('scale-100');
            }, 10);
            return true;
        }

        function cerrarBoleta() {
            const modal = document.getElementById('modal-boleta');
            document.getElementById('modal-content').classList.remove('scale-100');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        function ejecutarImpresion(customContent = null) {
            const content = customContent || document.getElementById('boleta-preview-content').innerHTML;
            if (!content || content.trim() === "") return;

            const printWindow = window.open('', '_blank', 'width=450,height=800');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Imprimir Boleta - MotoStock Pro</title>
                    <style>
                        @page { margin: 0; }
                        body { 
                            padding: 20px; 
                            background: #fff; 
                            font-family: 'Courier New', monospace;
                        }
                    </style>
                </head>
                <body>
                    ${content}
                    <script>
                        window.onload = function() {
                            window.print();
                            setTimeout(() => window.close(), 500);
                        }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        async function procesarPago() {
            if (cart.length === 0) return alert('⚠️ El carrito está vacío');
            
            // Validar DNI antes de proceder
            if (!verBoleta()) return; // verBoleta ya maneja la alerta y el foco si falta el DNI
            
            const content = document.getElementById('boleta-preview-content').innerHTML;

            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i><span>PROCESANDO...</span>';
            btn.disabled = true;

            setTimeout(() => {
                // 1. Ejecutar Impresión automáticamente
                ejecutarImpresion(content);

                // 2. Notificar éxito
                alert('✅ VENTA EXITOSA\nLa transacción ha sido registrada y la boleta enviada a impresión.');

                // 3. Limpiar todo
                cart = [];
                document.getElementById('dni-input').value = '';
                document.getElementById('nombre-cliente').value = '';
                document.getElementById('nombre-cliente').classList.remove('text-blue-600', 'font-bold');
                updateCartUI();
                cerrarBoleta();

                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', loadPOSProducts);
    </script>
    <script src="/controller/ui-logic.js"></script>
</body>
</html>
